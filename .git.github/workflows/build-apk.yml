name: Збірка Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Збірка APK додатку Кошик
    runs-on: ubuntu-latest

    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4

      - name: Встановлення Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Дозвіл на запуск Gradle
        run: chmod +x gradlew

      - name: Компіляція APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Збереження готового APK
        uses: actions/upload-artifact@v4
        with:
          name: koshyk-app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14