<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список покупок — Кошик</title>
    <meta property="og:image" content="https://koshyk-9d9c9.web.app/icon.png">

    <!-- Firebase SDKs -->
    <script defer src="/__/firebase/12.19.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.19.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.19.0/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <style>
      body { background: #f8fafc; color: #212529; font-family: system-ui, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
      .container { width: 100%; max-width: 450px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; }
      h2 { color: #008080; margin-top: 0; font-size: 20px; text-align: center; }
      .meta { text-align: center; color: #868e96; font-size: 13px; margin-bottom: 20px; }
      .item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #dee2e6; }
      .item:last-child { border-bottom: none; }
      .item-name { font-weight: 600; font-size: 15px; }
      .item-qty { color: #008080; font-weight: 700; font-size: 14px; }
      .loading { text-align: center; padding: 40px; color: #868e96; font-size: 15px; }
      .error { text-align: center; padding: 40px; color: #e63946; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <h2>Спільний список покупок</h2>
      <div class="loading" id="loadingText">Завантаження списку...</div>
      <div id="itemList" style="display: none;"></div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const pathSegments = window.location.pathname.split('/');
        const listId = pathSegments[pathSegments.length - 1];

        if (!listId || pathSegments[pathSegments.length - 2] !== 'i') {
          document.getElementById('loadingText').innerHTML = '<div class="error">Некоректне посилання на спільний список.</div>';
          return;
        }

        try {
          firebase.auth().signInAnonymously().then(() => {
            firebase.database().ref('sharedLists/' + listId).once('value', snapshot => {
              if (!snapshot.exists()) {
                document.getElementById('loadingText').innerHTML = '<div class="error">Список не знайдено або термін його дії завершився.</div>';
                return;
              }

              const data = snapshot.val();
              const now = Date.now();
              if (data.expiresAt && data.expiresAt <= now) {
                document.getElementById('loadingText').innerHTML = '<div class="error">Термін дії цього спільного списку завершився.</div>';
                return;
              }

              document.getElementById('loadingText').style.display = 'none';
              const itemList = document.getElementById('itemList');
              itemList.style.display = 'block';

              const items = Array.isArray(data.items) ? data.items : [];
              if (items.length === 0) {
                itemList.innerHTML = '<div class="loading">Список порожній.</div>';
                return;
              }

              items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                  <span class="item-name">${item.name || 'Товар'}</span>
                  <span class="item-qty">${item.qty || 1} шт.</span>
                `;
                itemList.appendChild(div);
              });
            }).catch(err => {
              document.getElementById('loadingText').innerHTML = '<div class="error">Помилка завантаження списку.</div>';
            });
          });
        } catch (e) {
          document.getElementById('loadingText').innerHTML = '<div class="error">Помилка ініціалізації.</div>';
        }
      });
    </script>
  </body>
</html>
